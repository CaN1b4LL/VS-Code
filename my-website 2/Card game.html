<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card game</title>
    <style>
        .player-title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 24px;
            color: black;
            margin-bottom: 15px;
            margin-top: 30px;
        }
        .card{
            background-color: #e2e2e2;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
            padding: 10px 20px;
            margin-right: 10px;
            display: inline-block;
            font-weight: bold;
        }
        .red-suit{
            color: #8b140c;
        }
        .black-suit{
            color: black;
        }
        
    </style>
</head>
<body>
    <div class="player-title">Player 1:</div>
    <div>
       <span class="card black-suit">2&clubsuit;</span>
       <span class="card red-suit">9&heartsuit;</span>
       <span class="card red-suit">6&heartsuit;</span>
       <span class="card red-suit">A&diamondsuit;</span>
       <span class="card black-suit">Q&spadesuit;</span>
       <span class="card black-suit">J&clubsuit;</span>
    </div>
    <div class="player-title">Player 2:</div>
    <div>
        <span class="card red-suit">3&heartsuit;</span>
        <span class="card black-suit">A&clubsuit;</span>
        <span class="card black-suit">10&clubsuit;</span>
        <span class="card red-suit">K&diamondsuit;</span>
        <span class="card black-suit">8&spadesuit;</span>
        <span class="card red-suit">3&heartsuit;</span>
    </div>
</body>
</html>
