<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card-header">CREDIT CARD DETAILS</div>
        <form class="card-form">
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="1234 5678 9012 3456">
            </div>
            <div class="form-group">
                <label for="card-name">Name On Card</label>
                <input type="text" id="card-name" placeholder="Name Surname">
            </div>
            <div class="bottom-grid">
                <div class="form-group date-group">
                    <label>Expire Date</label>
                    <div class="date-inputs">
                        <input type="text" placeholder="02">
                        <input type="text" placeholder="2017">
                    </div>
                </div>
                <div class="form-group csv-group">
                    <label for="card-csv">CSV No.</label>
                    <input type="text" id="card-csv" placeholder="***">
                </div>
            </div>
        </form>
        <div class="illustration-wrapper">
            <img src="icons_ht/moon_flag.png" alt="Space Illustration" class="card-illustration">
        </div>
    </div>
</body>
</html>
